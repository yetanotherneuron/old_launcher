[package]
name = "old_launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
old_launcher_core = { workspace = true }
iced = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rfd = { workspace = true }
dirs = { workspace = true }
open = { workspace = true }
png = { workspace = true }

[build-dependencies]
winresource = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
iced_test = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }

[workspace]
resolver = "3"
members = ["core", "indexer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://gitlab.com/juxuanu/old_launcher"

# Nothing outside tests may panic on purpose: errors are returned and shown.
# Tests may (clippy.toml), since a failed assertion is how they fail.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
# short directory `core/`, prefixed package (bare `core` collides with std)
old_launcher_core = { path = "core" }

iced = { version = "0.15.0-dev", features = ["tokio", "sipper", "svg"] }
iced_test = "0.15.0-dev"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "sync", "process"] }
# rustls on `ring`: no cmake/NASM toolchain needed on any platform.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rfd = "0.17"
dirs = "7"
open = "5"
# Decodes the window icon; already in the tree through iced.
png = "0.18"
# The Windows executable's icon and file details (build.rs).
winresource = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
tempfile = "3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Archive formats, all pure Rust (no C/C++ toolchain).
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma"] }
sevenz-rust2 = { version = "0.23", default-features = false, features = ["util", "bzip2", "ppmd", "deflate"] }
rars = "0.9"
# Reads and quotes the shell words of a client's launch settings.
shlex = "2"
# Lists running processes (on Linux and Windows alike), to tell whether a
# client's game is running.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# Release binaries are what people download: as fast and small as the
# compiler makes them, at the cost of slower release builds. Panics still
# unwind, so a panic in a background task becomes an error banner.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# iced 0.15 is unreleased — track the dev branch. Every iced crate in the tree
# must come from the same git source.
[patch.crates-io]
iced = { git = "https://github.com/iced-rs/iced", branch = "master" }
iced_test = { git = "https://github.com/iced-rs/iced", branch = "master" }
