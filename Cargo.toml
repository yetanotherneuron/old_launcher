[package]
name = "old_launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
old_launcher_core = { workspace = true }
iced = { workspace = true }
sipper = { workspace = true }
# The connection to Discord, and waiting before trying it again.
tokio = { workspace = true, features = ["net", "io-util", "time"] }
reqwest = { workspace = true }
rustls = { workspace = true }
rfd = { workspace = true }
dirs = { workspace = true }
open = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Downloading clients through BitTorrent, and reading what a torrent holds.
librqbit = { workspace = true }
librqbit-core = { workspace = true }

[build-dependencies]
winresource = { workspace = true }
png = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
old_launcher_core = { workspace = true, features = ["testing"] }
iced_test = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }

[workspace]
resolver = "3"
members = ["core", "indexer", "librqbit-sha1-wrapper"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://gitlab.com/juxuanu/old_launcher"
# The project page, where the downloads are.
homepage = "https://old-launcher.icarns.xyz/"

# Nothing outside tests may panic on purpose: errors are returned and shown.
# Tests may (clippy.toml), since a failed assertion is how they fail.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
# short directory `core/`, prefixed package (bare `core` collides with std)
old_launcher_core = { path = "core" }

# `advanced`: for the one widget of our own, the bar of work that can't say
# how far it got.
iced = { version = "0.15.0-dev", features = ["tokio", "sipper", "svg", "advanced"] }
# The progress a long task reports, which iced's tasks take but don't name.
sipper = "0.2"
iced_test = "0.15.0-dev"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "sync", "process"] }
# rustls on `ring`: no cmake/NASM toolchain needed on any platform.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rfd = "0.17"
dirs = "7"
open = "5"
# Decodes the window icon when building (build.rs).
png = "0.18"
# The Windows executable's icon and file details (build.rs).
winresource = "0.1"
# What the launcher does, for `RUST_LOG=old_launcher=info`.
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
# Canonical paths without Windows' `\\?\` prefix, which its shell can't open.
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
tempfile = "3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Archive formats, all pure Rust (no C/C++ toolchain).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["util", "bzip2", "ppmd", "deflate"] }
rars = "0.12"
# Gzipped tarballs, as DXVK publishes its releases; gzip through the same
# pure-Rust zlib the zip crate uses.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# The BitTorrent engine, with none of its features: its TLS ones bring
# aws-lc, and reqwest gets rustls on ring from the launcher's own features.
# Its hashes are patched to pure Rust below.
librqbit = { version = "9.0.1", default-features = false }
# Its torrent parser wants a hash feature named; the patched hashes make
# this one pure Rust too, whatever its name says.
librqbit-core = { version = "9.0.1", default-features = false, features = ["sha1-crypto-hash"] }
# Reads and quotes the shell words of a client's launch settings.
shlex = "2"
# Checks downloads against the checksums their publishers give.
sha2 = "0.10"
# Checks a client folder against the pieces of its torrent.
sha1 = "0.11"
# Lists running processes outside Windows, to tell whether a client's game
# is running under Wine or Proton.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Windows' own functions, to tell the same there asking for as little as
# Windows lets: the processes' names, then each `Wow.exe`'s path.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

# Release binaries are what people download: as fast and small as the
# compiler makes them, at the cost of slower release builds. Panics still
# unwind, so a panic in a background task becomes an error banner.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# iced 0.15 is unreleased: this is the commit of its master branch the
# launcher is written against. Every iced crate in the tree must come from
# the same git source.
[patch.crates-io]
# Pure-Rust hashes for librqbit, instead of OpenSSL or aws-lc.
librqbit-sha1-wrapper = { path = "librqbit-sha1-wrapper" }
iced = { git = "https://github.com/iced-rs/iced", rev = "cd04b74ca7073766f654535d6e72c452ef749d07" }
iced_test = { git = "https://github.com/iced-rs/iced", rev = "cd04b74ca7073766f654535d6e72c452ef749d07" }
