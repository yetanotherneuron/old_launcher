[package]
name = "old_launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
old_launcher_core = { workspace = true }
iced = { workspace = true }
# The connection to Discord, and waiting before trying it again.
tokio = { workspace = true, features = ["net", "io-util", "time"] }
reqwest = { workspace = true }
rustls = { workspace = true }
rfd = { workspace = true }
dirs = { workspace = true }
open = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
winresource = { workspace = true }
png = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
old_launcher_core = { workspace = true, features = ["testing"] }
iced_test = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }

[workspace]
resolver = "3"
members = ["core", "indexer"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://gitlab.com/juxuanu/old_launcher"
# The project page, where the downloads are.
homepage = "https://old-launcher-0d3217.gitlab.io/"

# Nothing outside tests may panic on purpose: errors are returned and shown.
# Tests may (clippy.toml), since a failed assertion is how they fail.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
# short directory `core/`, prefixed package (bare `core` collides with std)
old_launcher_core = { path = "core" }

iced = { version = "0.15.0-dev", features = ["tokio", "sipper", "svg"] }
iced_test = "0.15.0-dev"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "sync", "process"] }
# rustls on `ring`: no cmake/NASM toolchain needed on any platform.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rfd = "0.17"
dirs = "7"
open = "5"
# Decodes the window icon when building (build.rs).
png = "0.18"
# The Windows executable's icon and file details (build.rs).
winresource = "0.1"
# What the launcher does, for `RUST_LOG=old_launcher=info`.
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
# Canonical paths without Windows' `\\?\` prefix, which its shell can't open.
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
tempfile = "3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Archive formats, all pure Rust (no C/C++ toolchain).
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma"] }
sevenz-rust2 = { version = "0.23", default-features = false, features = ["util", "bzip2", "ppmd", "deflate"] }
rars = "0.9"
# Reads and quotes the shell words of a client's launch settings.
shlex = "2"
# Lists running processes (on Linux and Windows alike), to tell whether a
# client's game is running.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# Release binaries are what people download: as fast and small as the
# compiler makes them, at the cost of slower release builds. Panics still
# unwind, so a panic in a background task becomes an error banner.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# iced 0.15 is unreleased: this is the commit of its master branch the
# launcher is written against. Every iced crate in the tree must come from
# the same git source.
[patch.crates-io]
iced = { git = "https://github.com/iced-rs/iced", rev = "90dec30cc7368c3fbaac69790e43a4b08a21691d" }
iced_test = { git = "https://github.com/iced-rs/iced", rev = "90dec30cc7368c3fbaac69790e43a4b08a21691d" }
