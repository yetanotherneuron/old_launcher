# Checks the formatting, lints and tests every push, and every merge request.
# Pushes to the default branch that pass also build the downloadable binaries,
# which the README links to, publish the project page and keep the AUR
# package up to date.
# A scheduled pipeline regenerates the catalog instead, and commits it
# without starting another: the launchers read it from the repository.
#
# The first run builds everything from scratch (iced and wgpu take a while);
# later runs reuse each job's cached cargo registry, git checkouts and target
# directory.

stages:
  - check
  - release

default:
  # Pinned, so new clippy lints arrive with a deliberate bump rather than
  # failing an unrelated push. Keep it in step with the toolchain you develop
  # with.
  image: rust:1.98.1
  interruptible: true
  # The project's own runner.
  tags:
    - linux

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  # Smaller, faster builds: nothing here is ever debugged.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "false"
  CARGO_TERM_COLOR: always
  # The simulator tests render in software: runners have no GPU.
  ICED_TEST_BACKEND: tiny-skia
  DEBIAN_FRONTEND: noninteractive

# One pipeline per change: a merge request's, or else the branch's. A
# schedule runs only the `index` job. Pipelines of the default branch all
# run to the end, however quickly commits land on it; a branch's superseded
# pipeline is cancelled.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_BRANCH

# Every job but `fmt` waits for its namesake in an older pipeline to finish,
# so what a later commit publishes is never overtaken by an earlier one. Each
# resource group's process mode is set to oldest_first through the API.
.ordered:
  resource_group: $CI_JOB_NAME

.cargo:
  extends: .ordered
  cache:
    # Per job: clippy and the tests build different artifacts. Kept when
    # the job fails too: what was compiled is still good.
    key: $CI_JOB_NAME
    when: always
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/

# Every job but `index` and `pages`: not on a schedule.
.push:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# The code as rustfmt writes it. Like every check, it holds back the release
# stage: nothing is built or published from code it fails. It compiles
# nothing and publishes nothing, so it needs no cache and no ordering.
fmt:
  extends: .push
  stage: check
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt --all --check

clippy:
  extends: [.cargo, .push]
  stage: check
  before_script:
    - rustup component add clippy
  script:
    # Also enforces the workspace's no-panic lints (Cargo.toml).
    - cargo clippy --workspace --all-targets --locked -- -D warnings

test:
  extends: [.cargo, .push]
  stage: check
  variables:
    # mold links the big debug test binaries far faster than the default ld.
    CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  before_script:
    - apt-get update -qq && apt-get install -y -qq mold
  script:
    - cargo test --workspace --locked

# The Windows build, linted and tested. Wine runs the tests: not Windows,
# but its paths, files and the code written for it, without a Windows
# machine.
test-windows:
  extends: [.cargo, .push]
  stage: check
  variables:
    CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER: wine
    WINEPREFIX: /tmp/wine
    WINEDEBUG: "-all"
  before_script:
    - apt-get update -qq && apt-get install -y -qq gcc-mingw-w64-x86-64 wine wine64
    - rustup target add x86_64-pc-windows-gnu
    - rustup component add clippy
  script:
    - cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
    - cargo test --workspace --locked --target x86_64-pc-windows-gnu --no-fail-fast

# The binaries people download. Each job's latest successful artifact on the
# default branch is kept however old it gets (GitLab's "keep artifacts from
# most recent successful jobs"), which is what the README's links point at:
# https://gitlab.com/juxuanu/old_launcher/-/jobs/artifacts/main/raw/<file>?job=<job>
.release:
  extends: .cargo
  stage: release
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  artifacts:
    expire_in: 30 days

windows:
  extends: .release
  before_script:
    - apt-get update -qq && apt-get install -y -qq gcc-mingw-w64-x86-64
    - rustup target add x86_64-pc-windows-gnu
  script:
    # Only system DLLs: runs from wherever it is saved.
    - cargo build --release --locked --target x86_64-pc-windows-gnu
    - cp target/x86_64-pc-windows-gnu/release/old_launcher.exe .
  artifacts:
    paths:
      - old_launcher.exe

# Linked against glibc 2.28, so the binaries run on any distribution since
# 2018 (Debian 10, Ubuntu 20.04, Fedora 29, RHEL 8). Not static musl: the app
# loads the system's X11/Wayland and graphics libraries at run time, which a
# static binary can't do. zig does the linking, to that glibc version and
# for either architecture.
.linux:
  extends: .release
  variables:
    ZIG_VERSION: "0.16.0"
    ZIGBUILD_VERSION: "0.23.4"
  before_script:
    - mkdir -p /opt/zig /opt/zigbuild
    - curl -sSfL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
      | tar -xJ -C /opt/zig --strip-components=1
    - curl -sSfL "https://github.com/rust-cross/cargo-zigbuild/releases/download/v$ZIGBUILD_VERSION/cargo-zigbuild-x86_64-unknown-linux-gnu.tar.xz"
      | tar -xJ -C /opt/zigbuild --strip-components=1
    - export PATH="/opt/zig:/opt/zigbuild:$PATH"
    - rustup target add "$TARGET"
  script:
    - cargo zigbuild --release --locked --target "$TARGET.2.28"
    - cp "target/$TARGET/release/old_launcher" "$BINARY"
  artifacts:
    paths:
      - $BINARY

linux-x86_64:
  extends: .linux
  variables:
    TARGET: x86_64-unknown-linux-gnu
    BINARY: old_launcher-linux-x86_64

linux-arm64:
  extends: .linux
  variables:
    TARGET: aarch64-unknown-linux-gnu
    BINARY: old_launcher-linux-arm64

# Publishes aur/PKGBUILD to the AUR as old-launcher-git, with its version
# set and its .SRCINFO generated, on every pipeline of the default branch
# that gets this far. The version is that of the last commit changing the
# PKGBUILD, so an unchanged PKGBUILD comes out the same and there is nothing
# to push; a change is published by the next pipeline that passes, even if
# the one it came with failed.
#
# It needs the CI/CD variable AUR_SSH_PRIVATE_KEY (type Variable, protected,
# masked and hidden): the private half of an SSH key added to the AUR
# account that maintains the package, base64-encoded onto one line
# (`base64 -w0 <key>`), since GitLab only masks single-line values.
aur:
  extends: .ordered
  stage: release
  image: archlinux:base-devel
  # Never stopped halfway through a push to the AUR.
  interruptible: false
  variables:
    # The version counts commits, so the whole history is needed.
    GIT_DEPTH: 0
    AUR_PACKAGE: old-launcher-git
    # aur.archlinux.org's Ed25519 host key, as the AUR publishes it:
    # SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4.
    AUR_HOST_KEY: "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - pacman -Syu --noconfirm --needed git openssh
    - install -dm700 ~/.ssh
    - printf '%s' "$AUR_SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/aur
    - chmod 600 ~/.ssh/aur
    - echo "$AUR_HOST_KEY" > ~/.ssh/known_hosts
    - printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n' > ~/.ssh/config
  script:
    - git clone "ssh://aur@aur.archlinux.org/$AUR_PACKAGE.git" aur-repository
    - packaged=$(git log -1 --format=%H -- aur/PKGBUILD)
    - pkgver="r$(git rev-list --count "$packaged").$(git rev-parse --short=7 "$packaged")"
    - sed "s/^pkgver=.*/pkgver=$pkgver/" aur/PKGBUILD > aur-repository/PKGBUILD
    # makepkg refuses to run as root, even just to print the metadata, so
    # another user reads a copy: git refuses a clone its user doesn't own.
    - useradd --create-home packager
    - install -d -o packager /tmp/srcinfo
    - cp aur-repository/PKGBUILD /tmp/srcinfo/
    - su packager -c "cd /tmp/srcinfo && makepkg --printsrcinfo" > aur-repository/.SRCINFO
    - cd aur-repository
    - git add PKGBUILD .SRCINFO
    - >-
      if git diff --cached --quiet; then echo "The AUR already has this PKGBUILD."; exit 0; fi
    - git -c user.name="$GITLAB_USER_NAME" -c user.email="$GITLAB_USER_EMAIL" commit -m "Update to $pkgver"
    - git push origin HEAD:master

# The project page on GitLab Pages: the README, styled like the launcher,
# with its icon, its version and a footer back to the repository, plus the
# description of what is published (release.json), which the binaries check
# for a newer version. The address shows under Deploy > Pages.
pages:
  extends: .ordered
  stage: release
  image:
    name: pandoc/core:3.11
    entrypoint: [""]
  # The binaries, to describe them.
  needs: [windows, linux-x86_64, linux-arm64]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mkdir -p public
    # The version is the workspace's, the first `version = "…"` in the
    # manifest; the page's footer says it.
    - version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
    - sed "s/@VERSION@/$version/" pages/footer.html > footer.html
    # The stylesheet's address changes with every commit, so a browser that
    # cached the previous one doesn't style the new page with it.
    - >-
      pandoc README.md --standalone --from gfm --to html5
      --metadata pagetitle="Old Launcher"
      --syntax-highlighting=none
      --css "style.css?v=$CI_COMMIT_SHORT_SHA"
      --include-in-header pages/head.html
      --include-before-body pages/header.html
      --include-after-body footer.html
      --output public/index.html
    - cp pages/style.css assets/old_launcher.svg public/
    # The README's screenshots, at the same relative path.
    - mkdir -p public/assets
    - cp -r assets/screenshots public/assets/
    # The version and each binary's address, checksum and size, for the
    # launcher's update check.
    - sh pages/release.sh "$version" > public/release.json
    - cat public/release.json
  artifacts:
    paths:
      - public

# Regenerates the catalog from the upstream sources and commits it when it
# changed, which publishes it: the launchers read it from the repository.
# Run from a pipeline schedule (Build > Pipeline schedules, say weekly, on
# the default branch).
#
# It needs two CI/CD variables: CI_PUSH_TOKEN, a project access token with
# the `write_repository` scope (Settings > Access tokens; the Developer role
# is enough when the default branch allows developers to push), and
# GITHUB_TOKEN, any GitHub token, which only raises GitHub's API limits
# above what an anonymous run of the indexer gets.
index:
  extends: .cargo
  stage: check
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    # On top of the default branch as it is now, not as it was when the
    # pipeline was scheduled.
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - git checkout -q FETCH_HEAD
    - cargo run --release --locked --package indexer
    # The catalog, and what was found in archives that never change, which
    # the next run reuses instead of downloading them again.
    - git add index/wotlk.json index/archives.json
    - >-
      if git diff --cached --quiet; then echo "The catalog is up to date."; exit 0; fi
    # No pipeline for it: nothing built depends on the catalog, and the
    # binaries' download links point at the newest successful pipeline,
    # which must stay one that built them.
    - git -c user.name="Catalog schedule" -c user.email="$GITLAB_USER_EMAIL" commit -m "Update the catalog [skip ci]"
    - git push "https://oauth2:${CI_PUSH_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"
